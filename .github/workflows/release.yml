name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Apple Silicon runner: arm64 is native, x86_64 is cross-compiled from the
    # same macOS SDK, so one job can produce both packages.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build both architectures
        run: ./scripts/package_release.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
          generate_release_notes: true
