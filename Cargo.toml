[package]
name = "irec"
version = "0.1.4"
edition = "2024"

[dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
libc = "0.2.190"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = ["NSSharingService"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVAssetWriter", "AVAssetWriterInput", "AVMediaFormat", "AVVideoSettings", "AVAsset", "AVAssetImageGenerator", "AVAssetTrack", "objc2-core-media", "block2"] }
objc2-avf-audio = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-graphics = { version = "0.3.2", features = ["CGImage", "CGGeometry", "CGColorSpace", "CGBitmapContext"] }
objc2-core-audio-types = "0.3.2"
objc2-core-media = { version = "0.3.2", features = ["CMBlockBuffer", "objc2-core-audio-types"] }
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-screen-capture-kit = { version = "0.3.2", features = ["SCStream", "SCShareableContent", "SCScreenshotManager", "SCError", "objc2-core-media", "objc2-core-foundation", "objc2-core-graphics", "block2", "dispatch2"] }
objc2-uniform-type-identifiers = "0.3.2"

[[bin]]
name = "iRec"
path = "src/main.rs"
